name: Release and Publish Zentube Desktop (Mac, Windows, Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled binaries (yt-dlp & ffmpeg)
        run: node scripts/fetch-binaries.mjs ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Typecheck and test
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: npm test

      - name: Build and Publish Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

  publish:
    name: Publish Release (Undraft)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish release (undraft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(node -p 'require("./package.json").version')"
          echo "Publishing release $VERSION..."
          gh release edit "$VERSION" --draft=false --latest || true
